<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MusicBook | Metronome</title>

<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/animation.css">

</head>


<body>


<header class="navbar">


<div class="logo">
🎵 MusicBook
</div>

<button class="nav-toggle" aria-label="Toggle navigation">☰</button>

<nav>

<a href="../index.html">Home</a>

<a href="../pages/tools.html">Tools</a>

<a href="../pages/about.html">About</a>

<a href="../pages/contact.html">Contact</a>

</nav>


</header>


<main id="main">

<section class="tool-hero">

<h1>
🥁 Online Metronome
</h1>

<p>
A precise click track that runs from 40 to 240 BPM, with an
accented first beat for whatever time signature you're practicing.
</p>

</section>


<div class="tool-card">


<h2 id="bpmValue">
120 BPM
</h2>



<input
type="range"
id="bpm"
min="40"
max="240"
value="120"
aria-label="Beats per minute"
>


<label for="beatsPerBar">Beats per bar</label>

<select id="beatsPerBar">
    <option value="2">2 (Duple)</option>
    <option value="3">3 (Waltz)</option>
    <option value="4" selected>4 (Common)</option>
    <option value="6">6 (Compound)</option>
</select>


<div class="btn-row">

<button onclick="startMetronome()">
Start
</button>



<button onclick="stopMetronome()">
Stop
</button>

</div>


<p><span id="metroStatus" class="status-pill off">Stopped</span></p>


</div>


<p style="text-align:center;"><a class="back-link" href="../pages/tools.html">&larr; Back to Tools</a></p>

</main>




<footer>

<p>

</body>

</html>
