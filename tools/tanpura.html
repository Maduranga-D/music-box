<main id="main">

<section class="tool-hero">

<h1>
🎵 Virtual Tanpura
</h1>

<p>
A continuous Sa-Pa-Sa drone to practice against, just like a real
tanpura. Choose your key and mode below.
</p>

</section>


<div class="tool-card">

<label for="tanpuraKey">Key (Sa)</label>

<select id="tanpuraKey">
    <option value="C" selected>C</option>
    <option value="C#">C#</option>
    <option value="D">D</option>
    <option value="D#">D#</option>
    <option value="E">E</option>
    <option value="F">F</option>
    <option value="F#">F#</option>
    <option value="G">G</option>
    <option value="G#">G#</option>
    <option value="A">A</option>
    <option value="A#">A#</option>
    <option value="B">B</option>
</select>


<label for="tanpuraMode">Mode</label>

<select id="tanpuraMode">
    <option value="sa-pa" selected>Sa-Pa-Sa-Sa</option>
    <option value="sa-ma">Sa-Ma-Sa-Sa</option>
</select>


<div class="btn-row" style="margin-top:24px;">

    <div class="tanpura-string" style="width:14px;height:70px;background:var(--panel-2);border-radius:6px;"></div>
    <div class="tanpura-string" style="width:14px;height:70px;background:var(--panel-2);border-radius:6px;"></div>
    <div class="tanpura-string" style="width:14px;height:70px;background:var(--panel-2);border-radius:6px;"></div>
    <div class="tanpura-string" style="width:14px;height:70px;background:var(--panel-2);border-radius:6px;"></div>

</div>


<div class="btn-row">

    <button id="startTanpura">Start Drone</button>

    <button id="stopTanpura">Stop</button>

</div>


<p><span id="tanpuraStatus" class="status-pill off">Stopped</span></p>


</div>
